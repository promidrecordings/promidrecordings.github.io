<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROMID Recordings</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        p {
            color: #b3b3b3;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        .btn {
            background: #1db954;
            color: #000;
            padding: 14px 36px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: 0.3s;
            display: inline-block;
        }
        .btn:hover {
            background: #1ed760;
            transform: scale(1.05);
        }
        .footer {
            margin-top: 40px;
            color: #555;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <h1>🎧 PROMID Recordings</h1>
    <p>به پلیر اختصاصی ما خوش آمدید</p>
    <a href="/player/" class="btn">ورود به پلیر</a>
    <div class="footer">© 2026 PROMID Recordings</div>
</body>
</html>
